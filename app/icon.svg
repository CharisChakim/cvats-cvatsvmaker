<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Favicons are only ever read at 16-32px. The full C-V monogram carries too
       much detail for that: its counters close up and it renders as a smudge. So
       the tab mark keeps just the V, at a weight that stays crisp at 16px. The
       complete monogram lives in the header, where there is room for it. -->
  <rect width="64" height="64" rx="14" fill="#1F6F4A"/>
  <path d="M18 20 32 48 46 20" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
